<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration Eligibility</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
    <div class="header">
        <h1>Course Registration System</h1>
        <p>Check student eligibility before course registration</p>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">

            <h4>Student Information</h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label>Student Name</label>
                    <input id="studentName" class="form-control" value="Bilal Shah">
                </div>

                <div class="col-md-6">
                    <label>Current Semester</label>
                    <input id="semester" type="number" class="form-control" value="5">
                </div>

                <div class="col-md-6">
                    <label>CGPA</label>
                    <input id="cgpa" type="number" step="0.01" class="form-control" value="3.20">
                </div>

                <div class="col-md-6">
                    <label>Academic Standing</label>
                    <select id="standing" class="form-select">
                        <option value="Good">Good</option>
                        <option value="Probation">Probation</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Prerequisite Course</label>
                    <select id="prerequisite" class="form-select">
                        <option value="completed">Completed</option>
                        <option value="incomplete">Incomplete</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Fee Status</label>
                    <select id="fee" class="form-select">
                        <option value="paid">Paid</option>
                        <option value="unresolved">Unresolved</option>
                    </select>
                </div>
            </div>

            <h4 class="mt-4">Course Information</h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label>Course</label>
                    <input id="course" class="form-control" value="Advanced Artificial Intelligence">
                </div>

                <div class="col-md-6">
                    <label>Course Availability</label>
                    <select id="availability" class="form-select">
                        <option value="available">Available</option>
                        <option value="unavailable">Unavailable</option>
                    </select>
                </div>
            </div>

            <button onclick="checkEligibility()" class="btn btn-primary w-100 mt-4">
                Check Registration Eligibility
            </button>

            <div id="result" class="mt-4"></div>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
