<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

    <div class="header">
        <h1>Online Shopping</h1>
        <p>Order and discount calculation system</p>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">

            <h4>Product Information</h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label>Product</label>
                    <select id="product" class="form-select">
                        <option value="Laptop">Laptop</option>
                        <option value="Smartphone">Smartphone</option>
                        <option value="Tablet">Tablet</option>
                        <option value="Headphones">Headphones</option>
                        <option value="Smart Watch">Smart Watch</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Unit Price</label>
                    <input id="price" type="number" class="form-control" value="100000">
                </div>

                <div class="col-md-6">
                    <label>Quantity</label>
                    <input id="quantity" type="number" class="form-control" value="1" min="1">
                </div>

                <div class="col-md-6">
                    <label>Customer Type</label>
                    <select id="customerType" class="form-select">
                        <option value="regular">Regular Customer</option>
                        <option value="member">Premium Member</option>
                    </select>
                </div>
            </div>

            <button onclick="calculateOrder()" class="btn btn-primary w-100 mt-4">
                Calculate Order
            </button>

            <div id="result" class="mt-4"></div>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
