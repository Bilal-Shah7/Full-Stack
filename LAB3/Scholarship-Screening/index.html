<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Screening System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

    <div class="header">
        <h1>Scholarship Screening System</h1>
        <p>University student scholarship eligibility analysis</p>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">

            <h4>Student Information</h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label>Student Name</label>
                    <input id="name" class="form-control" value="Bilal Shah">
                </div>

                <div class="col-md-6">
                    <label>Program</label>
                    <input id="program" class="form-control" value="BS Computer Science">
                </div>

                <div class="col-md-6">
                    <label>Semester</label>
                    <input id="semester" type="number" class="form-control" value="5">
                </div>

                <div class="col-md-6">
                    <label>CGPA</label>
                    <input id="cgpa" type="number" step="0.01" class="form-control" value="3.20">
                </div>

                <div class="col-md-6">
                    <label>Family Income</label>
                    <input id="income" type="number" class="form-control" value="80000">
                </div>

                <div class="col-md-6">
                    <label>Attendance Percentage</label>
                    <input id="attendance" type="number" class="form-control" value="85">
                </div>

                <div class="col-md-6">
                    <label>Academic Performance</label>
                    <select id="performance" class="form-select">
                        <option value="good">Good</option>
                        <option value="average">Average</option>
                        <option value="poor">Poor</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Completed Credits</label>
                    <input id="credits" type="number" class="form-control" value="75">
                </div>
            </div>

            <button onclick="checkScholarship()" class="btn btn-primary w-100 mt-4">
                Analyze Scholarship Eligibility
            </button>

            <div id="result" class="mt-4"></div>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
