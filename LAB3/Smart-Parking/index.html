<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">

    <div class="header">
        <h1>Smart Campus Parking</h1>
        <p>University parking access management system</p>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">

            <h4>Vehicle Information</h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label>Owner Type</label>
                    <select id="ownerType" class="form-select">
                        <option value="faculty">Faculty</option>
                        <option value="student">Student</option>
                        <option value="staff">Staff</option>
                        <option value="visitor">Visitor</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Vehicle Type</label>
                    <select id="vehicleType" class="form-select">
                        <option value="car">Car</option>
                        <option value="bike">Bike</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Parking Area</label>
                    <select id="parkingArea" class="form-select">
                        <option value="faculty">Faculty Parking</option>
                        <option value="student">Student Parking</option>
                        <option value="visitor">Visitor Parking</option>
                        <option value="general">General Parking</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Available Spaces</label>
                    <input id="spaces" type="number" class="form-control" value="10" min="0">
                </div>

                <div class="col-md-6">
                    <label>University ID</label>
                    <select id="universityId" class="form-select">
                        <option value="valid">Valid</option>
                        <option value="invalid">Invalid</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Parking Permit</label>
                    <select id="permit" class="form-select">
                        <option value="valid">Valid</option>
                        <option value="invalid">Invalid</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Visitor Authorization</label>
                    <select id="visitorAuth" class="form-select">
                        <option value="approved">Approved</option>
                        <option value="not-approved">Not Approved</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Special Access</label>
                    <select id="specialAccess" class="form-select">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
            </div>

            <button onclick="checkParking()" class="btn btn-primary w-100 mt-4">
                Check Parking Access
            </button>

            <div id="result" class="mt-4"></div>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
