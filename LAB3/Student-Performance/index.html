<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
    <div class="dashboard-header">
        <h1>Student Performance Dashboard</h1>
        <p>Academic performance and attendance analysis</p>
    </div>

    <div class="card shadow-lg border-0">
        <div class="card-body p-4">

            <h4 class="section-title">Student Information</h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label>Student Name</label>
                    <input type="text" id="studentName" class="form-control" value="Bilal Shah">
                </div>

                <div class="col-md-6">
                    <label>Student ID</label>
                    <input type="text" id="studentId" class="form-control" value="2024-CS-101">
                </div>

                <div class="col-md-6">
                    <label>Program</label>
                    <input type="text" id="program" class="form-control" value="BS Computer Science">
                </div>

                <div class="col-md-6">
                    <label>Semester</label>
                    <input type="number" id="semester" class="form-control" value="5">
                </div>
            </div>

            <h4 class="section-title mt-4">Academic Performance</h4>

            <div class="row g-3">
                <div class="col-md-4">
                    <label>Assignment Marks</label>
                    <input type="number" id="assignment" class="form-control" value="80">
                </div>

                <div class="col-md-4">
                    <label>Quiz Marks</label>
                    <input type="number" id="quiz" class="form-control" value="75">
                </div>

                <div class="col-md-4">
                    <label>Examination Marks</label>
                    <input type="number" id="exam" class="form-control" value="72">
                </div>

                <div class="col-md-6">
                    <label>Attendance Percentage</label>
                    <input type="number" id="attendance" class="form-control" value="85">
                </div>
            </div>

            <button class="btn btn-primary mt-4 w-100" onclick="analyzeStudent()">
                Analyze Student
            </button>

            <div id="result" class="mt-4"></div>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
